<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IIDS — Contact</title>
<meta name="description" content="How to reach the Institute for Interdisciplinary Data Sciences (IIDS) at the University of Idaho — inquiries routed by need.">
<meta name="keywords" content="IIDS, Institute for Interdisciplinary Data Sciences, University of Idaho, U of I, UIdaho, contact, research computing, genomics, proposals and grants">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../components/site-shell/site-shell.css">
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="../components/content-render/content-render.css">
<style>
  .contact-block{margin-bottom:40px;max-width:70ch}
  .contact-block h2{font-size:1.3rem;font-weight:700;margin-bottom:12px;color:var(--text-strong)}
  /* The footer's "Contact by need" links land on the rendered h3s; clear the fixed nav. */
  .contact-block .rendered h3{font-size:1.05rem;margin-top:22px;scroll-margin-top:calc(var(--nav-h) + 16px)}
  .contact-block[id]{scroll-margin-top:calc(var(--nav-h) + 16px)}
</style>
</head>
<body class="theme-light">

<site-nav active="contact"></site-nav>

<div class="pagehead">
  <div class="wrap">
    <p class="eyebrow">Contact</p>
    <h1>Contact</h1>
    <p>Routed by need rather than a single inbox. Pick the line that matches your question; anything else goes to the general inbox and is forwarded.</p>
  </div>
</div>

<main id="main" tabindex="-1" class="wrap" style="padding-top:28px;padding-bottom:80px">
  <!-- Both blocks render from content/ through content-render; #general, #proposals and
       #partnerships are h3 ids carried in content/contact_by_need.md (the footer's targets). -->
  <section class="contact-block" id="by-need">
    <h2>By need</h2>
    <div class="rendered" data-content="contact_by_need"></div>
  </section>
  <section class="contact-block" id="units">
    <h2>Direct lines per unit</h2>
    <div class="rendered" data-content="contact_core_contacts"></div>
  </section>
</main>

<site-footer>Routes still being set up are listed on the page and go to the general inbox in the meantime.</site-footer>

<script src="../components/content-render/content-render.generated.js"></script>
<script src="../components/content-render/content-render.js"></script>
<script>ContentRender.mountAll();</script>
<script src="../components/site-shell/site-shell.js"></script>
</body>
</html>
